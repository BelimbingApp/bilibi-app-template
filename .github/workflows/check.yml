name: Check setup
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
    secrets:
      SOURCE_READ_TOKEN:
        required: false
      SOURCE_APP_PRIVATE_KEY:
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BILIBI_CHECK_DATABASE_URL: postgresql://postgres@127.0.0.1:5439/setup_check
      TMPDIR: ${{ github.workspace }}/build/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.6.0'
      - name: Install native prerequisites and start a disposable PostgreSQL 18
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y python3-venv postgresql-18
          sudo install -d -o postgres -g postgres /var/lib/postgresql/setup-check
          sudo -u postgres /usr/lib/postgresql/18/bin/initdb -D /var/lib/postgresql/setup-check --auth=trust
          sudo -u postgres /usr/lib/postgresql/18/bin/pg_ctl -D /var/lib/postgresql/setup-check -l /var/lib/postgresql/setup-check/server.log -o '-h 127.0.0.1 -p 5439' -w start
          createdb -h 127.0.0.1 -p 5439 -U postgres setup_check
      - name: Test publisher helpers
        if: hashFiles('maker.toml') == ''
        run: python3 -m unittest discover -s tests
      # An adopted application runs the exact maker tooling recorded in maker.lock;
      # the maker's own checkout runs its scripts. CI never advances the record.
      - name: Install the recorded maker tooling
        run: |
          tools=$(./bilibi tooling)
          echo "BILIBI_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "BILIBI_TOOL_APPLICATION_ROOT=$PWD" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      # Preferred over the SOURCE_READ_TOKEN secret: a GitHub App installed only
      # on the private source repositories mints a read-only token that expires
      # within the hour and is revoked when the job ends.
      - name: Mint a source read token from the GitHub App
        id: source-app
        if: vars.SOURCE_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || (vars.SOURCE_READ_ON_PULL_REQUESTS == 'true' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - name: Materialize exact sources
        env:
          # Pull requests receive no source secret, unless the repository sets
          # SOURCE_READ_ON_PULL_REQUESTS to true; then pull requests from its own
          # branches do. Pull requests from forks never do.
          SOURCE_READ_TOKEN: ${{ (github.event_name != 'pull_request' || (vars.SOURCE_READ_ON_PULL_REQUESTS == 'true' && github.event.pull_request.head.repo.full_name == github.repository)) && (steps.source-app.outputs.token || secrets.SOURCE_READ_TOKEN) || '' }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          GIT_ASKPASS="$BILIBI_TOOLS/scripts/source-askpass.sh" python3 "$BILIBI_TOOLS/scripts/recipe.py" materialize
          GIT_ASKPASS="$BILIBI_TOOLS/scripts/source-askpass.sh" python3 "$BILIBI_TOOLS/scripts/recipe.py" verify-remote
      - name: Validate the saved recipe and lock
        run: python3 "$BILIBI_TOOLS/scripts/recipe.py" check-record
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/native-tools
            build/zig-cache
            build/zigbuild-cache
            build/target
          key: native-linux-x86_64-${{ hashFiles('setup.toml', 'composition/*', 'rust-toolchain.toml', 'builder.toml', 'maker.lock', 'scripts/native_builder.py') }}
      - name: Prepare the pinned native builder
        run: '"$BILIBI_TOOLS/scripts/builder.sh" --setup'
      # Call the saved-record scripts directly; CI never chooses or saves versions.
      - name: Restore and check the whole setup
        run: |
          mkdir -p build/evidence
          /usr/bin/time -p "$BILIBI_TOOLS/scripts/builder.sh" "$BILIBI_TOOLS/scripts/check.sh" 2> >(tee build/evidence/check-time.txt >&2)
      - name: Name the validation-only package commit
        if: inputs.release_tag != '' && endsWith(inputs.release_tag, '-test')
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: git tag "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Package checked bytes
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          "$BILIBI_TOOLS/scripts/builder.sh" python3 "$BILIBI_TOOLS/scripts/package.py" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          "$BILIBI_TOOLS/scripts/builder.sh" python3 "$BILIBI_TOOLS/scripts/verify-package.py" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: inputs.release_tag != ''
        with:
          name: setup-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: build-times
          path: build/evidence/*
          if-no-files-found: warn
      - name: Stop the disposable PostgreSQL cluster
        if: always()
        run: |
          if sudo test -f /var/lib/postgresql/setup-check/postmaster.pid; then
            sudo -u postgres /usr/lib/postgresql/18/bin/pg_ctl -D /var/lib/postgresql/setup-check -m fast -w stop
          fi
